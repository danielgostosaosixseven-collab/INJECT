name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build iOS app without code signing
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/INJECT-DerivedData"
          xcodebuild \
            -project "filza_base/ThreeOneOSFive.xcodeproj" \
            -scheme "Filza Bypass External" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/Release-iphoneos"
          APP_PATH=""
          for candidate in "$PRODUCTS_DIR"/*.app; do
            if [[ -d "$candidate" ]]; then
              APP_PATH="$candidate"
              break
            fi
          done
          if [[ -z "$APP_PATH" ]]; then
            echo "No iOS .app product was produced." >&2
            exit 1
          fi

          if /usr/bin/codesign -d "$APP_PATH" >/dev/null 2>&1; then
            echo "The app unexpectedly has a code signature; refusing to label it unsigned." >&2
            exit 1
          fi
          if [[ -e "$APP_PATH/embedded.mobileprovision" ]]; then
            echo "A provisioning profile was found; refusing to label the IPA unsigned." >&2
            exit 1
          fi

          IPA_ROOT="$RUNNER_TEMP/INJECT-ipa"
          mkdir -p "$IPA_ROOT/Payload"
          /usr/bin/ditto "$APP_PATH" "$IPA_ROOT/Payload/$(basename "$APP_PATH")"
          (cd "$IPA_ROOT" && /usr/bin/zip -qr "$GITHUB_WORKSPACE/INJECT-unsigned.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/INJECT-unsigned.ipa"
          echo "Created INJECT-unsigned.ipa with code signing disabled."

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: INJECT-unsigned-ipa
          path: INJECT-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
